<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Directo - Backend</title>
    <style>
        body { font-family: Arial; padding: 2rem; background: #f5f5f5; }
        .result { background: white; padding: 1rem; margin: 1rem 0; border-radius: 4px; }
        .success { border-left: 4px solid green; }
        .error { border-left: 4px solid red; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Test Directo al Backend</h1>
    
    <button onclick="test1()">Test 1: http://127.0.0.1:3000/api/test</button>
    <button onclick="test2()">Test 2: http://localhost:3000/api/test</button>
    <button onclick="test3()">Test 3: /api/products/sealed/magic?limit=1</button>
    
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        async function test1() {
            addResult('🔄 Testing 127.0.0.1:3000/api/test...');
            try {
                const response = await fetch('http://127.0.0.1:3000/api/test');
                const data = await response.json();
                addResult(`✅ Status: ${response.status}`, true);
                addResult(JSON.stringify(data, null, 2), true);
            } catch (error) {
                addResult(`❌ Error: ${error.message}`, false);
            }
        }

        async function test2() {
            addResult('🔄 Testing localhost:3000/api/test...');
            try {
                const response = await fetch('http://localhost:3000/api/test');
                const data = await response.json();
                addResult(`✅ Status: ${response.status}`, true);
                addResult(JSON.stringify(data, null, 2), true);
            } catch (error) {
                addResult(`❌ Error: ${error.message}`, false);
            }
        }

        async function test3() {
            addResult('🔄 Testing /api/products/sealed/magic...');
            try {
                const response = await fetch('http://127.0.0.1:3000/api/products/sealed/magic?limit=1');
                const data = await response.json();
                addResult(`✅ Status: ${response.status}`, true);
                addResult(`Productos: ${data.products?.length || 0}`, true);
                if (data.products && data.products.length > 0) {
                    addResult(`Primer producto: ${data.products[0].title}`, true);
                }
            } catch (error) {
                addResult(`❌ Error: ${error.message}`, false);
            }
        }

        function addResult(text, success = null) {
            const div = document.createElement('div');
            div.className = 'result' + (success === true ? ' success' : success === false ? ' error' : '');
            div.textContent = text;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }
    </script>
</body>
</html>
